<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!--
    App icons are drawn straight onto the dock and the app grid, so they have to
    carry their own contrast: the plate is what makes the mark visible against
    whatever is behind it. Same geometry as COSMIC's own app icons - inset 24,
    corner radius 16, of 256.
  -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2C323D"/>
      <stop offset="1" stop-color="#1D2026"/>
    </linearGradient>
  </defs>

  <path d="M24 40C24 31.1634 31.1634 24 40 24H216C224.837 24 232 31.1634 232 40V216C232 224.837 224.837 232 216 232H40C31.1634 232 24 224.837 24 216V40Z"
        fill="url(#plate)"/>

  <!-- The supplied mark, unchanged: only scaled and centred on the plate. -->
  <g transform="translate(128 128) scale(1.389) translate(-64 -64)" fill="#FFFFFF">
    <circle cx="54" cy="74" r="10" fill-opacity="0.85"/>
    <circle cx="20" cy="108" r="10" fill-opacity="0.55"/>

    <circle cx="18" cy="68" r="5.5" fill-opacity="0.5"/>
    <circle cx="59" cy="113" r="4.5" fill-opacity="0.38"/>

    <circle cx="88" cy="40" r="30" fill-opacity="1"/>
  </g>
</svg>
